name: CI tests

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Rails CI Tests
    runs-on: ubuntu-26.04

    services:
      mysql-container:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: somepassword
        ports:
          - "3306:3306"

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install dependencies
        # runner is amd64v3 which mise PPA does not provide natively
        run: |
          sudo apt update -y
          sudo apt autoremove mysql-server -y
          sudo apt install --no-install-recommends -y \
            software-properties-common build-essential curl rsync netcat-openbsd \
            redis-server cron extrepo libmysqlclient-dev imagemagick
          sudo add-apt-repository -y ppa:jdxcode/mise
          sudo sed -i '/^Types:/a Architectures: amd64' /etc/apt/sources.list.d/jdxcode-ubuntu-mise-resolute.sources
          sudo apt update -y
          sudo apt install -y mise
          mise use -g node@22 npm:yarn@1.22 ruby@4.0 gem:rubocop@1.92
          eval $(mise activate bash)
          echo "PATH=$PATH" >> $GITHUB_ENV
          MAKEFLAGS="-j$(nproc)" bundle install --retry 3

      - name: Run Tests
        env:
          RAILS_ENV: test
        run: |
          cp config/database.ci.yml config/database.yml
          bundle exec rails db:prepare
          bundle exec rails test
